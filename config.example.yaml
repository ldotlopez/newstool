# Copy to config.yaml and adjust.
# Secrets come from the environment or from a .env file next to this one:
# ${OLLAMA_API_KEY}, ${TELEGRAM_BOT_TOKEN}, ${TELEGRAM_CHAT_ID},
# ${TELEGRAM_JUNTAS_CHAT_ID}, ${GOOGLECHAT_WEBHOOK_URL}.
# Write a literal dollar sign in a value as $$; comments are not expanded.

# Used when neither --log-level, -v/-q nor NEWSTOOL_LOG_LEVEL set a level.
# log_level: info

# Where things live. Relative paths are relative to this file; ~ is expanded.
# storage_dir holds everything stored: data.db and content/.
# storage_dir: ~/.local/share/newstool   # default: the user data directory
# cache_dir: ~/.cache/newstool           # default: the user cache directory

# Any key can also come from a NEWSTOOL_* variable (or the .env next to this
# file), which wins over this file; `__` nests: NEWSTOOL_CACHE__EXPIRATION=2h,
# NEWSTOOL_PLUGINS__OLLAMA__API_BASE=http://box:11434, NEWSTOOL_STORAGE_DIR=data.
# OLLAMA_HOST and OLLAMA_API_KEY fill the ollama plugin's api_base and api_key
# when this file does not set them.

# Lengths of time, here and in plugin options, are seconds or take a unit
# suffix: 90s, 5m, 2h, 3d, 1h30m.
cache:
  expiration: 6h

# Plugin types and the defaults of their options in every use of the type:
# the catalog entries and the applet and sink instances below override them
# (nested mappings key by key; any other value, lists included, whole).
# Options left out take the type's defaults. A section builds nothing.
plugins:
  ollama:
    api_base: http://localhost:11434
    # api_key: from OLLAMA_API_KEY, or ${OLLAMA_API_KEY} here
    chat_model: gemma4:12b
    embed_model: mxbai-embed-large:latest

  # A provider's options, for every source of it.
  # feedreader:
  #   fetch_article: true  # fetch each entry's page, not the feed's text
  #   article_selector: article  # keep only this element of the item's HTML

  # `llm:` names the LLM by id or type (default: the first in `llms`) and
  # `model:` overrides its default model.
  tagger:
    model: gemma4:12b

  feed:
    title: Castelló news
  digest:                            # one digest of a week's stories
    span_days: 7

  telegram:                          # instances may name their own bot
    bot_token: ${TELEGRAM_BOT_TOKEN} # and chat
  googlechat:                        # by incoming webhook
    url: ${GOOGLECHAT_WEBHOOK_URL}   # or `channel` (space id) and `token`

# The catalog: every configured use of a plugin type, with its `options` over
# the type's section, validated at startup and built only when a workflow
# runs it. Defining an entry never runs it: only `workflows` (at the end)
# run, and an entry no workflow names gets a warning. An `id` names an entry
# so that workflows can refer to it; a processor entry without one takes its
# type's name.

# LLMs, for the processors and applets that use one.
llms:
  - ollama

sources:
  - id: elperiodicomediterraneo-castello
    name: El Periódico Mediterraneo (Castelló ciudad)
    provider: prensaiberica
    url: https://www.elperiodicomediterraneo.com/castello
    options:
      # Index sections left out, by header title (case-insensitive).
      exclude_sections: [Comarcas, Vídeos y galerías de Castellón]

  - id: castelloninformacion-castello
    name: Castellón información (Castelló ciudad)
    provider: castelloninformacion
    url: https://www.castelloninformacion.com/noticies/castello/

  - id: castellonplaza
    name: Castellón Plaza
    provider: plaza
    url: https://castellonplaza.com/castellon9/

  - id: the-guardian-spain
    name: The Guardian (Spain)
    provider: theguardian
    url: https://www.theguardian.com/world/spain

  # Only the `juntas` workflow names it (see `workflows` below).
  - id: juntagobiernolocal
    name: Junta de Gobierno Local
    provider: csjuntasgobierno
    url: https://www.castello.es/es/sesiones

  # Any RSS or Atom feed. `options` override, for this source only, the
  # options in the provider's plugin section.
  # - id: some-blog
  #   name: Some blog
  #   provider: feedreader
  #   url: https://blog.example.com/feed.xml
  #   options:
  #     fetch_article: true  # fetch the full article
  #     article_selector: article .post-body  # keep only its body

# Each processor entry writes one annotation key, the processor's own unless
# the entry names another with `key`; a key is written by one entry. An entry
# without `id` is named by its type (`markdownify`), so two entries of one
# type need ids.
processors:
  - markdownify                      # markdown
  - summarize                        # summary
  - tagger                           # tags
  - processor: classify              # topics, from a closed list
    options:
      labels: [política, urbanismo, vivienda, cultura, economía, deportes, sucesos]
  # Embeddings, for a digest with `algorithm: embeddings`:
  # - processor: embed                 # tags/embedding
  #   id: embed-tags
  # - processor: embed                 # markdown/embedding
  #   id: embed-markdown
  #   options: {input: markdown}
  # For the `spain-abroad` digest below: a second summary, in Spanish, with
  # its own prompt and model, its embedding and a yes/no label, for sources
  # that mix in other news:
  # - processor: summarize
  #   id: summary-es
  #   key: summary/es
  #   options:
  #     prompt: "Resume en español el siguiente artículo:\n\n"
  #     model: gemma4:27b
  # - processor: embed                 # summary/embedding/es
  #   id: embed-summary-es
  #   options: {input: summary/es}
  # - processor: classify
  #   id: about-spain
  #   key: about/spain
  #   options:
  #     question: Is the article mainly about Spain or Spaniards?
  #     labels: ["yes", "no"]          # quoted: YAML reads yes/no as booleans

# Sink instances: where documents go and how fast. Every sink takes
# `interval` (time between deliveries, oldest first; default 0),
# `max_per_run` (default 5) and `max_retries` (default 3).
sinks:
  - id: telegram-main
    sink: telegram
    options:
      chat_id: ${TELEGRAM_CHAT_ID}
      interval: 30m
      images: true                   # the document's image as a photo, if any
      link_text: original article    # the link's text
      link_preview: false            # Telegram's link preview, text posts only
      markdown: false                # the text as Markdown, not plain text
  - id: telegram-juntas
    sink: telegram
    options:
      chat_id: ${TELEGRAM_JUNTAS_CHAT_ID}
      interval: 30m
      max_per_run: 1
  - id: chat-main
    sink: googlechat
    options:
      images: true
      link_text: original article
  # - id: site
  #   sink: file
  #   options:
  #     path: /srv/www/{app}.xml     # {app}, {output}, {key} are replaced

# Applet instances, run by their workflow when due: `every` after their last
# success, on `days`, once a day from `at` (local time); without any, on
# every run of their workflow. An instance reads exactly its workflow's
# sources. Each output goes to the sink instances in `routes`; `sink` is the
# shorthand for an applet with one output. An instance's `id` keys its state
# and documents: renaming it starts it from scratch.
apps:
  - id: main-items                   # each new summarized item, once
    app: itemfeed
    options:
      annotation: summary            # the annotation posted, e.g. summary/es
    routes:
      items: [telegram-main, chat-main]
  - id: juntas-items
    app: itemfeed
    sink: telegram-juntas
  - id: castello-weekly              # Mondays from 07:00, last week's stories
    app: digest
    at: "07:00"
    days: [mon]
    options:
      title: Castelló
      exclude: {topics: [deportes, sucesos]}
      topic_weights: {vivienda: 3, urbanismo: 2}
      # write: false                 # only the plan, to tune the options
    routes:
      digest: [telegram-main]        # the plan: `inspect documents`
  # Foreign media on Spain, daily, in Spanish (the `spain-abroad` workflow
  # below runs summary-es, embed-summary-es and about-spain on its sources):
  # - id: spain-abroad
  #   app: digest
  #   at: "08:00"
  #   options:
  #     title: España en la prensa extranjera
  #     span_days: 1
  #     input: summary/es
  #     include: {about/spain: ["yes"]}
  #     algorithm: embeddings
  #     embedding: summary/es
  #     story_prompt: "Explica qué cuenta cada medio extranjero sobre esta noticia, citándolo por su nombre..."
  #   routes:
  #     digest: [chat-main]
  # - id: headlines
  #   app: feed
  #   every: 1h
  #   options: {max_items: 10}
  #   sink: site

# Workflows: the only thing that runs. Each names, by `id`, its sources, its
# process entries (in order) and its applet instances, and is the whole
# chain: import its sources, process them, run its instances that are due,
# then deliver to the sinks they are routed to. A source or processor can be
# in several workflows (a processor skips what is done); an applet instance
# in one only. Every key an instance reads must be written by its own
# workflow. Run them with `run -w NAME` (repeatable) or `run --all`, e.g.
# from cron:
#   */15 * * * *  newstool -c config.yaml run --all
workflows:
  - name: castello                   # each new summary, to Telegram and Chat
    sources:
      - elperiodicomediterraneo-castello
      - castelloninformacion-castello
      - castellonplaza
      - the-guardian-spain
    process: [markdownify, summarize]
    apps: [main-items]
  - name: castello-weekly            # Mondays from 07:00: last week's stories
    sources:
      - elperiodicomediterraneo-castello
      - castelloninformacion-castello
      - castellonplaza
    process: [markdownify, summarize, tagger, classify]
    apps: [castello-weekly]
  - name: juntas
    sources: [juntagobiernolocal]
    process: [markdownify, summarize]
    apps: [juntas-items]
  # - name: spain-abroad
  #   sources: [the-guardian-spain]
  #   process: [markdownify, tagger, summary-es, embed-summary-es, about-spain]
  #   apps: [spain-abroad]
